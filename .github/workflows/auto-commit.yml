name: Auto Commit
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '12 1 * * *'
    - cron: '24 2 * * *'
    - cron: '36 3 * * *'
    - cron: '48 4 * * *'
    - cron: '0 6 * * *'
    - cron: '12 7 * * *'
    - cron: '24 8 * * *'
    - cron: '36 9 * * *'
    - cron: '48 10 * * *'
    - cron: '0 12 * * *'
    - cron: '12 13 * * *'
    - cron: '24 14 * * *'
    - cron: '36 15 * * *'
    - cron: '48 16 * * *'
    - cron: '0 18 * * *'
    - cron: '12 19 * * *'
    - cron: '24 20 * * *'
    - cron: '36 21 * * *'
    - cron: '48 22 * * *'
  workflow_dispatch: {}
# Eyni anda yalnız BİR run işləsin. Digərləri avtomatik növbəyə düşür,
# beləliklə iki run heç vaxt eyni fayla eyni anda toxunmur (konflikt kökü budur).
concurrency:
  group: auto-commit-lock
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  auto-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Git istifadəçi ayarları
        run: |
          git config user.name "nurullaibadov"
          git config user.email "ibadnurulla@gmail.com"
          git config pull.rebase false
          git config advice.mergeConflict false
      - name: Log yaz, commit et və push et (tam retry qorumalı)
        run: |
          set -e
          MAX_TRIES=10
          for i in $(seq 1 "$MAX_TRIES"); do
            echo "=== Cəhd $i / $MAX_TRIES ==="
            # Hər cəhddə repo-nu 100% təmiz, ən son remote vəziyyətinə sıfırla.
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd
            # ÖNƏMLİ: qovluq clean/reset-dən SONRA yaradılır, çünki
            # untracked qovluq git clean -fd tərəfindən silinir.
            mkdir -p auto-commit-log
            # Yeni log sətri əlavə et
            echo "Commit zamanı: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> auto-commit-log/log.txt
            git add auto-commit-log/log.txt
            if git diff --cached --quiet; then
              echo "Dəyişiklik yoxdur, commit atlanılır. Əməliyyat tamamlandı."
              exit 0
            fi
            git commit -m "Auto commit: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            if git push origin main; then
              echo "✅ Push uğurlu oldu (cəhd $i)."
              exit 0
            fi
            WAIT=$(( (RANDOM % 5) + 3 ))
            echo "⚠️ Push uğursuz oldu. $WAIT saniyə gözlənilir və yenidən cəhd olunur..."
            sleep "$WAIT"
          done
          echo "❌ $MAX_TRIES cəhddən sonra push mümkün olmadı."
          exit 1
